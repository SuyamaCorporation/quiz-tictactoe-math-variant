<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Fact Tic-Tac-Toe</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes winLine {
    from { opacity: 0; transform: scaleX(0); }
    to { opacity: 1; transform: scaleX(1); }
  }
  @keyframes pulse-win {
    0%, 100% { background-color: rgba(253, 224, 71, 0.4); }
    50% { background-color: rgba(253, 224, 71, 0.8); }
  }
  @keyframes timerPulse {
    0%, 100% { color: #ef4444; }
    50% { color: #fca5a5; }
  }
  .win-cell { animation: pulse-win 0.6s ease-in-out infinite; }
  .timer-urgent { animation: timerPulse 0.5s ease-in-out infinite; }
  .cell-x { color: #3b82f6; }
  .cell-o { color: #ef4444; }
  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop-in { animation: popIn 0.3s ease-out forwards; }
</style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-start p-4">
<div class="w-full max-w-2xl">
  <h1 class="text-3xl font-bold text-center mb-2 text-yellow-400">Math Fact Tic-Tac-Toe</h1>

  <!-- Mode & Difficulty -->
  <div class="flex flex-wrap gap-2 justify-center mb-4">
    <div class="bg-gray-800 rounded-lg p-2 flex gap-2 items-center">
      <span class="text-xs text-gray-400">Mode:</span>
      <button id="btnHvAI" onclick="setMode('hvai')" class="px-3 py-1 rounded text-sm font-semibold bg-blue-600 text-white">vs AI</button>
      <button id="btnHvH" onclick="setMode('hvh')" class="px-3 py-1 rounded text-sm font-semibold bg-gray-600 text-white">2 Player</button>
    </div>
    <div class="bg-gray-800 rounded-lg p-2 flex gap-2 items-center">
      <span class="text-xs text-gray-400">Math:</span>
      <button id="diffEasy" onclick="setDiff('easy')" class="px-3 py-1 rounded text-sm font-semibold bg-green-600 text-white">Easy</button>
      <button id="diffMed" onclick="setDiff('medium')" class="px-3 py-1 rounded text-sm font-semibold bg-gray-600 text-white">Medium</button>
      <button id="diffHard" onclick="setDiff('hard')" class="px-3 py-1 rounded text-sm font-semibold bg-gray-600 text-white">Hard</button>
    </div>
    <div id="aiDiffContainer" class="bg-gray-800 rounded-lg p-2 flex gap-2 items-center">
      <span class="text-xs text-gray-400">AI:</span>
      <button id="aiEasy" onclick="setAIDiff('easy')" class="px-3 py-1 rounded text-sm font-semibold bg-gray-600 text-white">Easy</button>
      <button id="aiMed" onclick="setAIDiff('medium')" class="px-3 py-1 rounded text-sm font-semibold bg-yellow-600 text-white">Medium</button>
      <button id="aiHard" onclick="setAIDiff('hard')" class="px-3 py-1 rounded text-sm font-semibold bg-gray-600 text-white">Hard</button>
    </div>
  </div>

  <!-- Score -->
  <div class="flex justify-center gap-6 mb-4">
    <div class="text-center">
      <div class="text-2xl font-bold text-blue-400" id="scoreX">0</div>
      <div class="text-xs text-gray-400" id="labelX">Player X</div>
    </div>
    <div class="text-center">
      <div class="text-lg font-bold text-gray-400" id="scoreDraw">0</div>
      <div class="text-xs text-gray-400">Draw</div>
    </div>
    <div class="text-center">
      <div class="text-2xl font-bold text-red-400" id="scoreO">0</div>
      <div class="text-xs text-gray-400" id="labelO">Player O / AI</div>
    </div>
  </div>

  <!-- Status -->
  <div class="text-center mb-3 h-8">
    <span id="statusMsg" class="text-lg font-semibold text-yellow-300">Game starts — X goes first!</span>
  </div>

  <!-- Timer toggle -->
  <div class="flex justify-center gap-3 mb-3">
    <label class="flex items-center gap-2 cursor-pointer text-sm text-gray-300">
      <input type="checkbox" id="timerToggle" onchange="toggleTimer()" class="w-4 h-4 accent-yellow-400">
      10s Timer
    </label>
    <div id="timerDisplay" class="font-mono text-xl font-bold text-green-400 hidden">10</div>
  </div>

  <!-- Board -->
  <div class="grid grid-cols-3 gap-2 mb-4" id="board" aria-label="Tic-Tac-Toe board">
    <!-- cells generated by JS -->
  </div>

  <!-- Question area -->
  <div id="questionArea" class="bg-gray-800 rounded-xl p-4 mb-4 hidden">
    <div class="flex justify-between items-center mb-2">
      <div class="text-xs text-gray-400">Claiming square <span id="claimSquare"></span> for <span id="claimPlayer" class="font-bold"></span></div>
    </div>
    <div class="text-2xl font-bold text-center mb-3 text-white" id="questionText"></div>
    <div class="flex gap-2">
      <input type="number" id="answerInput" aria-label="Your answer"
        class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white text-lg text-center focus:outline-none focus:border-yellow-400"
        placeholder="Answer..." onkeydown="if(event.key==='Enter')submitAnswer()">
      <button onclick="submitAnswer()" aria-label="Submit answer"
        class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold px-6 py-2 rounded-lg transition">
        GO
      </button>
    </div>
    <div id="answerFeedback" class="text-center mt-2 text-sm h-5"></div>
  </div>

  <!-- New Game -->
  <div class="flex justify-center">
    <button onclick="newGame()" aria-label="Start new game"
      class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-8 py-2 rounded-lg transition">
      New Game
    </button>
  </div>
</div>

<script>
// --- State ---
let mode = 'hvai'; // 'hvai' | 'hvh'
let mathDiff = 'easy';
let aiDiff = 'medium';
let board = Array(9).fill(null); // null | 'X' | 'O'
let currentPlayer = 'X';
let gameOver = false;
let scores = { X: 0, O: 0, draw: 0 };
let pendingCell = null;
let currentQuestion = null;
let timerEnabled = false;
let timerInterval = null;
let timerValue = 10;
let winLine = null;

// --- Init ---
function init() {
  renderBoard();
  newGame();
}

// --- Mode / Difficulty setters ---
function setMode(m) {
  mode = m;
  document.getElementById('btnHvAI').className = `px-3 py-1 rounded text-sm font-semibold ${m==='hvai'?'bg-blue-600':'bg-gray-600'} text-white`;
  document.getElementById('btnHvH').className = `px-3 py-1 rounded text-sm font-semibold ${m==='hvh'?'bg-blue-600':'bg-gray-600'} text-white`;
  document.getElementById('aiDiffContainer').style.display = m==='hvai' ? 'flex' : 'none';
  document.getElementById('labelO').textContent = m==='hvai' ? 'AI O' : 'Player O';
  newGame();
}

function setDiff(d) {
  mathDiff = d;
  ['easy','medium','hard'].forEach(x => {
    document.getElementById('diff'+x.charAt(0).toUpperCase()+x.slice(1)).className =
      `px-3 py-1 rounded text-sm font-semibold ${x===d?'bg-green-600':'bg-gray-600'} text-white`;
  });
}

function setAIDiff(d) {
  aiDiff = d;
  ['easy','medium','hard'].forEach(x => {
    document.getElementById('ai'+x.charAt(0).toUpperCase()+x.slice(1)).className =
      `px-3 py-1 rounded text-sm font-semibold ${x===d?'bg-yellow-600':'bg-gray-600'} text-white`;
  });
}

// --- Board rendering ---
function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('button');
    cell.className = 'aspect-square rounded-xl text-4xl font-black flex items-center justify-center transition-all cursor-pointer border-2 ' +
      (board[i] ? 'bg-gray-700 border-gray-600 cursor-not-allowed' : 'bg-gray-800 border-gray-600 hover:border-yellow-400 hover:bg-gray-700');
    cell.setAttribute('aria-label', `Cell ${i+1}: ${board[i] || 'empty'}`);
    cell.style.minHeight = '80px';

    if (board[i]) {
      const span = document.createElement('span');
      span.className = board[i]==='X' ? 'cell-x' : 'cell-o';
      span.textContent = board[i];
      cell.appendChild(span);
    }

    if (winLine && winLine.includes(i)) {
      cell.classList.add('win-cell');
    }

    if (!board[i] && !gameOver) {
      cell.onclick = () => cellClick(i);
    }
    boardEl.appendChild(cell);
  }
}

// --- Game logic ---
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function checkWinner(b) {
  for (const [a,bb,c] of WINS) {
    if (b[a] && b[a]===b[bb] && b[a]===b[c]) return { winner: b[a], line: [a,bb,c] };
  }
  if (b.every(x => x)) return { winner: 'draw', line: [] };
  return null;
}

function newGame() {
  board = Array(9).fill(null);
  currentPlayer = 'X';
  gameOver = false;
  winLine = null;
  pendingCell = null;
  currentQuestion = null;
  stopTimer();
  document.getElementById('questionArea').classList.add('hidden');
  document.getElementById('answerFeedback').textContent = '';
  setStatus(`Game starts — X goes first!`);
  renderBoard();
}

function setStatus(msg) {
  document.getElementById('statusMsg').textContent = msg;
}

function cellClick(i) {
  if (gameOver || board[i] || pendingCell !== null) return;
  if (mode === 'hvai' && currentPlayer === 'O') return; // AI's turn
  askQuestion(i);
}

function askQuestion(cellIdx) {
  pendingCell = cellIdx;
  currentQuestion = generateQuestion();
  document.getElementById('claimSquare').textContent = cellIdx + 1;
  document.getElementById('claimPlayer').textContent = currentPlayer;
  document.getElementById('claimPlayer').className = 'font-bold ' + (currentPlayer==='X'?'text-blue-400':'text-red-400');
  document.getElementById('questionText').textContent = currentQuestion.text;
  document.getElementById('answerInput').value = '';
  document.getElementById('answerFeedback').textContent = '';
  document.getElementById('questionArea').classList.remove('hidden');
  document.getElementById('answerInput').focus();
  if (timerEnabled) startTimer();
}

function submitAnswer() {
  if (pendingCell === null) return;
  const raw = document.getElementById('answerInput').value.trim();
  if (raw === '') return;
  const userAns = parseFloat(raw);
  stopTimer();
  if (Math.abs(userAns - currentQuestion.answer) < 0.001) {
    board[pendingCell] = currentPlayer;
    document.getElementById('answerFeedback').className = 'text-center mt-2 text-sm h-5 text-green-400';
    document.getElementById('answerFeedback').textContent = 'Correct!';
    setTimeout(() => {
      pendingCell = null;
      currentQuestion = null;
      document.getElementById('questionArea').classList.add('hidden');
      const result = checkWinner(board);
      if (result) {
        endGame(result);
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        renderBoard();
        setStatus(`${currentPlayer}'s turn`);
        if (mode === 'hvai' && currentPlayer === 'O') {
          setTimeout(aiTurn, 600);
        }
      }
      renderBoard();
    }, 400);
  } else {
    document.getElementById('answerFeedback').className = 'text-center mt-2 text-sm h-5 text-red-400';
    document.getElementById('answerFeedback').textContent = `Wrong! Answer was ${currentQuestion.answer}. Square stays unclaimed.`;
    setTimeout(() => {
      pendingCell = null;
      currentQuestion = null;
      document.getElementById('questionArea').classList.add('hidden');
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      renderBoard();
      setStatus(`${currentPlayer}'s turn (previous player got it wrong)`);
      if (mode === 'hvai' && currentPlayer === 'O') {
        setTimeout(aiTurn, 600);
      }
    }, 1500);
  }
}

function endGame(result) {
  gameOver = true;
  winLine = result.line;
  renderBoard();
  if (result.winner === 'draw') {
    scores.draw++;
    setStatus("It's a draw!");
  } else {
    scores[result.winner]++;
    setStatus(`${result.winner} wins!`);
  }
  updateScoreDisplay();
}

function updateScoreDisplay() {
  document.getElementById('scoreX').textContent = scores.X;
  document.getElementById('scoreO').textContent = scores.O;
  document.getElementById('scoreDraw').textContent = scores.draw;
}

// --- AI ---
function aiTurn() {
  if (gameOver) return;
  setStatus('AI is thinking...');
  const emptyCells = board.map((v,i) => v===null?i:-1).filter(i=>i>=0);
  if (emptyCells.length === 0) return;

  let chosenCell;
  if (aiDiff === 'easy') {
    chosenCell = emptyCells[Math.floor(Math.random()*emptyCells.length)];
  } else if (aiDiff === 'medium') {
    chosenCell = Math.random() < 0.7 ? minimaxCell() : emptyCells[Math.floor(Math.random()*emptyCells.length)];
  } else {
    chosenCell = minimaxCell();
  }

  // AI gets a question too, but "AI" answers correctly always (it's a computer!)
  // For fun: easy AI sometimes gets it wrong
  const q = generateQuestion();
  let aiCorrect = true;
  if (aiDiff === 'easy') aiCorrect = Math.random() > 0.3;
  else if (aiDiff === 'medium') aiCorrect = Math.random() > 0.1;

  if (aiCorrect) {
    board[chosenCell] = 'O';
    const result = checkWinner(board);
    if (result) {
      renderBoard();
      endGame(result);
    } else {
      currentPlayer = 'X';
      renderBoard();
      setStatus(`X's turn`);
    }
  } else {
    currentPlayer = 'X';
    renderBoard();
    setStatus(`AI answered wrong! X's turn`);
  }
}

function minimaxCell() {
  let best = -Infinity, bestCell = -1;
  for (let i = 0; i < 9; i++) {
    if (!board[i]) {
      board[i] = 'O';
      const score = minimax(board, 0, false);
      board[i] = null;
      if (score > best) { best = score; bestCell = i; }
    }
  }
  return bestCell;
}

function minimax(b, depth, isMax) {
  const result = checkWinner(b);
  if (result) {
    if (result.winner === 'O') return 10 - depth;
    if (result.winner === 'X') return depth - 10;
    return 0;
  }
  if (isMax) {
    let best = -Infinity;
    for (let i=0;i<9;i++) if (!b[i]) { b[i]='O'; best=Math.max(best,minimax(b,depth+1,false)); b[i]=null; }
    return best;
  } else {
    let best = Infinity;
    for (let i=0;i<9;i++) if (!b[i]) { b[i]='X'; best=Math.min(best,minimax(b,depth+1,true)); b[i]=null; }
    return best;
  }
}

// --- Question Generator ---
function generateQuestion() {
  if (mathDiff === 'easy') return genEasy();
  if (mathDiff === 'medium') return genMedium();
  return genHard();
}

function genEasy() {
  const ops = ['+','-'];
  const op = ops[Math.floor(Math.random()*ops.length)];
  let a = Math.floor(Math.random()*20)+1;
  let b = Math.floor(Math.random()*20)+1;
  if (op==='-' && b>a) [a,b]=[b,a];
  const ans = op==='+'?a+b:a-b;
  return { text: `${a} ${op} ${b} = ?`, answer: ans };
}

function genMedium() {
  const ops = ['×','÷'];
  const op = ops[Math.floor(Math.random()*ops.length)];
  let a,b,ans;
  if (op==='×') {
    a = Math.floor(Math.random()*12)+1;
    b = Math.floor(Math.random()*12)+1;
    ans = a*b;
    return { text: `${a} × ${b} = ?`, answer: ans };
  } else {
    b = Math.floor(Math.random()*11)+2;
    ans = Math.floor(Math.random()*10)+1;
    a = b*ans;
    return { text: `${a} ÷ ${b} = ?`, answer: ans };
  }
}

function genHard() {
  const type = Math.floor(Math.random()*4);
  if (type===0) {
    const a=Math.floor(Math.random()*50)+10,b=Math.floor(Math.random()*50)+10;
    return { text: `${a} + ${b} = ?`, answer: a+b };
  } else if (type===1) {
    const a=Math.floor(Math.random()*15)+2,b=Math.floor(Math.random()*15)+2;
    return { text: `${a} × ${b} = ?`, answer: a*b };
  } else if (type===2) {
    const bases=[2,3,4,5,6,7,8,9,10];
    const base=bases[Math.floor(Math.random()*bases.length)];
    const exp=Math.floor(Math.random()*3)+2;
    return { text: `${base}^${exp} = ?`, answer: Math.pow(base,exp) };
  } else {
    const a=Math.floor(Math.random()*100)+20,b=Math.floor(Math.random()*19)+2;
    const ans=Math.floor(a/b);
    return { text: `floor(${a} ÷ ${b}) = ?`, answer: ans };
  }
}

// --- Timer ---
function toggleTimer() {
  timerEnabled = document.getElementById('timerToggle').checked;
  document.getElementById('timerDisplay').classList.toggle('hidden', !timerEnabled);
}

function startTimer() {
  timerValue = 10;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerValue--;
    updateTimerDisplay();
    if (timerValue <= 0) {
      stopTimer();
      document.getElementById('answerFeedback').className='text-center mt-2 text-sm h-5 text-red-400';
      document.getElementById('answerFeedback').textContent = `Time's up! Answer was ${currentQuestion.answer}.`;
      setTimeout(() => {
        pendingCell = null;
        currentQuestion = null;
        document.getElementById('questionArea').classList.add('hidden');
        currentPlayer = currentPlayer==='X'?'O':'X';
        renderBoard();
        setStatus(`${currentPlayer}'s turn (time ran out)`);
        if (mode==='hvai'&&currentPlayer==='O') setTimeout(aiTurn,600);
      }, 1500);
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  el.textContent = timerValue;
  el.className = 'font-mono text-xl font-bold ' + (timerValue <= 3 ? 'timer-urgent' : 'text-green-400');
}

// Start
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('aiDiffContainer').style.display = 'flex';
  init();
});
</script>
</body>
</html>
